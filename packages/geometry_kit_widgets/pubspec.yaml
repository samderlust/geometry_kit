name: geometry_kit_widgets
description: Flutter widgets for geometry_kit shapes — CustomPainter-backed, styled, themable, and composable. Includes circle, ellipse, rectangle, triangle, polygon, line, a multi-shape canvas, and a 3D scene for geometry_kit_3d solids.
version: 0.3.0

homepage: https://github.com/samderlust/geometry_kit/tree/main/packages/geometry_kit_widgets
repository: https://github.com/samderlust/geometry_kit
issue_tracker: https://github.com/samderlust/geometry_kit/issues

screenshots:
  - description: "2D Geo* widgets with gradients and dash patterns"
    path: screenshots/widgets_2d.png
  - description: "GeoScene 3D bar chart"
    path: screenshots/scene.png
  - description: "SolidGradient on 3D solids"
    path: screenshots/gradients.png

topics:
  - geometry
  - widgets
  - custom-painter
  - shapes
  - flutter

resolution: workspace

environment:
  sdk: ^3.11.3
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  geometry_kit: ^1.0.0
  geometry_kit_3d: ^0.1.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
